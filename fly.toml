# Configuración de Fly.io para la API de Vylet (modo mínimo / gratis)
# App: cambia "vylet-api" por el nombre global que elijas al hacer fly launch
app = "vylet-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Aplica las migraciones de prisma/migrations ANTES de arrancar cada despliegue
[deploy]
  release_command = "npx prisma migrate deploy"
